name: R checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev libtiff-dev libcurl4-openssl-dev libxml2-dev libssl-dev poppler-utils
      - name: Install R dependencies
        run: Rscript scripts/install.R
      - name: Check CLI and tests
        run: |
          Rscript bin/cytof-qc.R --help
          Rscript tests/run.R
